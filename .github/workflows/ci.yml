name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI offline
        run: python -m doku_visual_agent plan --script examples/volkswagen_60s.txt --fixture examples/demo_assets.json --output runs/ci
      - name: Verify generated report
        run: |
          test -s runs/ci/plan.json
          test -s runs/ci/review.html

  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python
        run: python -m pip install -e .
      - name: Build demo timeline
        run: |
          python -m doku_visual_agent plan --script examples/volkswagen_60s.txt --fixture examples/demo_assets.json --output runs/ci
          python -m doku_visual_agent prepare-render --run runs/ci --output runs/ci/render --demo
      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Render first 30 frames
        working-directory: remotion
        run: |
          npx remotion render src/index.jsx DokuVideo ../runs/ci/DEMO-1s.mp4 --props ../runs/ci/render/props.json --public-dir ../runs/ci/render/public --frames=0-29 --log=error --concurrency=1
      - name: Install FFprobe for codec verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Inspect actual MP4
        run: |
          test -s runs/ci/DEMO-1s.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json runs/ci/DEMO-1s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-demo-1s
          path: runs/ci/DEMO-1s.mp4
          retention-days: 7

  volkswagen-real-photo-pilot:
    # Integration smoke test with genuine Commons images. No API keys.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install voice and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python package
        run: python -m pip install -e .
      - name: Produce historical script and robotic technical test narration
        run: |
          python -m doku_visual_agent pilot-script --manifest examples/vw_wolfsburg_pilot.json --output runs/pilot
          espeak-ng -v de -s 153 -f runs/pilot/narration.txt -w runs/pilot/narration.wav
      - name: Resolve actual photo metadata, check CC licenses and stage preview files
        run: |
          python -m doku_visual_agent pilot-prepare \
            --manifest examples/vw_wolfsburg_pilot.json \
            --voiceover runs/pilot/narration.wav \
            --output runs/pilot/render
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('runs/pilot/render/props.json').read_text())
          seconds=data['durationInFrames']/data['fps']
          assert 40 <= seconds <= 95, seconds
          assert sum(s['kind']=='image' for s in data['scenes']) == 4
          assert data['demo'] is True and data['publication_ready'] is False
          print(f"Pilot: {seconds:.1f}s, {len(data['scenes'])} shots, 4 genuine Commons photographs")
          PY
      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Render full historically sourced pilot (half-scale CI preview)
        working-directory: remotion
        run: |
          npx remotion render src/index.jsx DokuVideo ../runs/pilot/VW-PILOT-NICHT-VEROEFFENTLICHEN.mp4 \
            --props ../runs/pilot/render/props.json \
            --public-dir ../runs/pilot/render/public \
            --scale 0.5 --log=error --concurrency=2
      - name: Verify video actually contains picture and voiceover
        run: |
          test -s runs/pilot/VW-PILOT-NICHT-VEROEFFENTLICHEN.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height \
            -of json runs/pilot/VW-PILOT-NICHT-VEROEFFENTLICHEN.mp4 > runs/pilot/technical_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('runs/pilot/technical_probe.json').read_text())
          assert any(s['codec_type']=='video' for s in p['streams'])
          assert any(s['codec_type']=='audio' for s in p['streams'])
          print("Video and audio streams verified")
          PY
      - name: Upload review-only pilot with image license journal
        uses: actions/upload-artifact@v4
        with:
          name: volkswagen-60s-real-photo-pilot-review-only
          path: |
            runs/pilot/VW-PILOT-NICHT-VEROEFFENTLICHEN.mp4
            runs/pilot/render/credits.json
            runs/pilot/render/review.html
            runs/pilot/render/public/media/*.jpg
            runs/pilot/render/rights_to_review.md
            runs/pilot/technical_probe.json
            runs/pilot/shotlist.json
          retention-days: 7
